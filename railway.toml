# Force Railway to use Nixpacks and ignore Dockerfile
[build]
builder = "NIXPACKS"
buildCommand = "pnpm install && pnpm turbo build --filter=api..."
dockerfilePath = "" # Explicitly set to empty to ignore Dockerfile

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ALWAYS"

# Define environments for production and preview
[environments]
  [environments.production]
  branch = "main"

  [environments.preview]
  branchRegex = "^(develop|PR-.+)$"
