[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm turbo build --filter=api..."
watchPatterns = [
  "apps/api/**",
  "packages/**"
]

[deploy]
startCommand = "cd apps/api && node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"

[environments]
  [environments.production]
  branch = "main"
  autoDeploy = true

  [environments.preview]
  branchRegex = "^(develop|PR-.+)$"
  autoDeploy = true

[nix]
channel = "stable"

# Optional: Configure resources for your service
[resources]
memory = 512
cpu = 0.5

# Sync build status back to GitHub
[github]
autoDeploy = true
deployWithPullRequestSynchronize = true
